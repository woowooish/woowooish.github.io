name: Site quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Static and state-machine checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, immutable Node 24 pin
        with:
          persist-credentials: false
      - name: Check browser-script syntax
        run: for file in assets/*.js; do node --check "$file"; done
      - name: Check release verification syntax
        run: python3 -m py_compile scripts/check-live.py
      - name: Whole-site structure and privacy boundaries
        run: |
          python3 scripts/check-quality.py
          python3 scripts/check-security-source.py
      - name: Existing feature regression tests
        run: |
          node scripts/check-site.cjs
          node scripts/check-reflections.cjs
          node scripts/check-daily.cjs
          node scripts/check-daily-loading.cjs
          node scripts/check-daily-sharing.cjs
          node scripts/check-sharing-links.cjs
          node scripts/check-chooser.cjs
          python3 scripts/check-live-test.py
          node scripts/check-photos.cjs
          node scripts/check-woo-deck.cjs
      - name: Note storage and analytics regression tests
        run: |
          node scripts/check-gratitude.cjs
          node scripts/check-privacy.cjs
      - name: Prepare source-only review evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          output = root / 'audit-evidence'
          output.mkdir(exist_ok=True)
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.html', '.js', '.cjs', '.py', '.css', '.md', '.json', '.yml', '.yaml', '.txt', '.xml', '.svg'}
          manifest = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'files': {}}
          with zipfile.ZipFile(output / 'source-text.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(filter(None, tracked)):
                  path = root / name
                  if path.is_symlink() or not path.is_file():
                      continue
                  data = path.read_bytes()
                  manifest['files'][name] = hashlib.sha256(data).hexdigest()
                  if path.suffix in extensions or name in {'CNAME', '.nojekyll', '.gitignore'}:
                      archive.writestr(name, data)
              archive.writestr('review-manifest.json', json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Retain review evidence without photos or font files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 immutable pin
        with:
          name: source-review-evidence
          path: audit-evidence/source-text.zip
          retention-days: 7
          if-no-files-found: error
  browser:
    name: Browser policy and native cross-tab checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # immutable reviewed pin
        with:
          persist-credentials: false
      - name: Exercise real pages with security policy enabled
        run: |
          node scripts/check-browser-runtime.cjs
          node scripts/check-legacy-runtime.cjs
          node scripts/check-hardening-runtime.cjs
          node scripts/check-daily-sharing-browser.cjs
          node scripts/check-review-runtime.cjs
  live:
    name: Public release byte verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 immutable Node 24 pin
        with:
          persist-credentials: false
      - name: Match public files to the exact merge commit
        run: python3 scripts/check-live.py
      - name: Observe HTTPS and hosting response headers
        run: python3 scripts/check-transport.py
      - name: Retain public deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 immutable pin
        with:
          name: live-release-verification
          path: audit-evidence/*verification.json
          retention-days: 14
          if-no-files-found: error
