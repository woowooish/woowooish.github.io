<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pick Your Woo | WooWooish</title><meta name="description" content="Choose one of three cards and discover a gentle reminder for today. A little Woo for wherever you are."><style>
:root{--ink:#393c37;--sage:#6b8072;--cream:#f8f5ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 25%,#f6ede4,var(--cream) 65%);color:var(--ink);font-family:Georgia,serif;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:25px max(22px,7vw);gap:15px}a{color:inherit;text-decoration:none}header a:first-child{font-size:22px;letter-spacing:2px}header a:last-child{font:13px system-ui;letter-spacing:1px}.wrap{max-width:1000px;margin:auto;padding:42px 20px 90px;text-align:center}.eyebrow{font:12px system-ui;letter-spacing:4px;text-transform:uppercase;color:var(--sage)}h1{font-size:clamp(42px,7vw,76px);font-weight:400;margin:18px 0 14px}p{line-height:1.75}.intro{font-size:18px;color:#656b63;margin:0 auto 36px;max-width:580px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:760px;margin:0 auto 30px}.card{border:0;background:none;padding:0;cursor:pointer;perspective:1000px;aspect-ratio:3/4.2;color:inherit}.inner{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}.card.revealed .inner{transform:rotateY(180deg)}.front,.back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:140px 140px 18px 18px;backface-visibility:hidden;box-shadow:0 12px 35px #5a57461b;padding:20px}.front{background:linear-gradient(145deg,#dfe7da,#f1ede5);border:1px solid #ffffffb8}.front:before{content:"";position:absolute;inset:10px;border:1px solid #ffffffa8;border-radius:130px 130px 12px 12px}.symbol{font-size:clamp(38px,6vw,64px);color:#8a9c8d;margin-bottom:16px;filter:drop-shadow(0 3px 6px #536b5525)}.front .card-title{font:italic clamp(16px,2.4vw,25px) Georgia,serif;letter-spacing:.2px;color:#4e6758;z-index:1}.front .card-hint{font:10px system-ui;letter-spacing:2px;text-transform:uppercase;color:#768979;margin-top:14px;z-index:1}.card:nth-child(2) .front{background:linear-gradient(155deg,#e6e5f1,#f6eae8)}.card:nth-child(3) .front{background:linear-gradient(155deg,#f3e8d7,#e5eee5)}.card:hover:not(:disabled) .front{box-shadow:0 18px 45px #5a574633;transform:translateY(-5px)}.front{transition:transform .25s,box-shadow .25s}.number{font:11px system-ui;letter-spacing:3px;color:#748174}.back{background:#fffdf9;border:1px solid #d9ded3;transform:rotateY(180deg)}.back strong{font-size:clamp(17px,2.3vw,24px);font-weight:400;line-height:1.35}.back small{font:11px system-ui;letter-spacing:2px;color:var(--sage);margin-bottom:15px}.card:focus-visible{outline:3px solid #6d8d76;outline-offset:5px}.card:disabled{cursor:default}.result{max-width:620px;margin:35px auto 0;background:#ffffffa8;border:1px solid #e8e3da;padding:35px 28px;border-radius:18px;animation:rise .5s ease}.result h2{font-weight:400;font-size:30px}.reflection{font-style:italic;color:#657468}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:25px}button.action{border:1px solid #8b9a8b;background:#718675;color:white;border-radius:30px;padding:13px 20px;font:13px system-ui;cursor:pointer}button.action.secondary{background:transparent;color:#4d6755}footer{margin-top:60px;font:12px system-ui;letter-spacing:2px;color:#758075}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:560px){.cards{gap:9px}.front,.back{padding:9px;border-radius:75px 75px 12px 12px}.front:before{inset:6px;border-radius:70px 70px 8px 8px}.back strong{font-size:13px}.back small{font-size:8px;letter-spacing:1px}.intro{font-size:16px}.wrap{padding-top:25px}}@media(prefers-reduced-motion:reduce){.inner{transition:none}.result{animation:none}}</style></head><body><header><a href="/">woowooish</a><a href="/">← Back to home</a></header><main class="wrap"><div class="eyebrow">A little ritual for today</div><h1>Pick Your Woo ✨</h1><p class="intro">Take a breath. Notice what you're drawn to. Choose one card and uncover a little reminder for wherever you are today.</p><div class="cards" id="cards" aria-label="Choose a card"></div><div id="result" aria-live="polite"></div><footer>calm · peace · love<br><br>The Woo was within you all along. 🤍</footer></main><script>
const messages=[["You are already enough.","You don't need to become someone else to deserve love, rest, or joy.","Where can you stop trying to prove yourself today?"],["Let the unknown be open.","Not knowing what comes next doesn't mean you're on the wrong path.","What possibility could you make room for?"],["Come back to this moment.","There is something beautiful here, even if today feels ordinary.","What small thing can you appreciate right now?"],["Softness is strength.","You can hold a boundary and still keep your heart open.","Where can you be both gentle and clear?"],["You are allowed to begin again.","A new chapter doesn't require a perfect ending to the last one.","What's one tiny fresh start available today?"],["Your pace is yours.","You don't have to rush your becoming. Growth can be quiet.","What would moving at your own pace look like?"],["Love can start within.","Offer yourself some of the warmth you so freely give away.","What would kindness toward yourself sound like?"],["You can feel it all.","Joy and grief can exist together. Neither cancels the other.","What feeling needs room instead of fixing?"],["Notice the good.","The smallest moments often carry the most peace.","What made you smile, even briefly, today?"],["Release the grip.","You can care deeply without controlling the outcome.","What might you gently loosen your hold on?"],["Rest is part of the journey.","You don't need to earn a moment of stillness.","How could you give yourself permission to pause?"],["Trust your own wisdom.","You can listen to others and still hear your own inner voice.","What do you already know deep down?"]];let selected=null;let choices=[];const cards=document.getElementById('cards'),result=document.getElementById('result');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){selected=null;choices=shuffle(messages).slice(0,3);result.innerHTML='';cards.innerHTML='';choices.forEach((m,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label','Reveal '+['The Sunbeam','The Moonlight','The Wildflower'][i]+' card');const covers=[['☼','The Sunbeam'],['☾','The Moonlight'],['✿','The Wildflower']];b.innerHTML='<span class="inner"><span class="front"><span class="symbol">'+covers[i][0]+'</span><span class="card-title">'+covers[i][1]+'</span><span class="card-hint">Trust your pull ✧</span></span><span class="back"><small>YOUR WOO</small><strong></strong></span></span>';b.querySelector('strong').textContent=m[0];b.addEventListener('click',()=>reveal(i));cards.appendChild(b)})}function reveal(i){if(selected!==null)return;selected=choices[i];[...cards.children].forEach((c,j)=>{if(i===j)c.classList.add('revealed');c.disabled=true});setTimeout(()=>{result.innerHTML='<section class="result"><div class="eyebrow">Your Woo for today</div><h2></h2><p class="message"></p><p class="reflection"></p><p>Take this Woo with you today. 🤍</p><div class="actions"><button class="action" id="share">Share my Woo</button><button class="action secondary" id="save">Save my Woo</button><button class="action secondary" id="again">Pick another Woo</button></div></section>';result.querySelector('h2').textContent=selected[0];result.querySelector('.message').textContent=selected[1];result.querySelector('.reflection').textContent='A moment to reflect: '+selected[2];document.getElementById('again').onclick=start;document.getElementById('share').onclick=share;document.getElementById('save').onclick=save;},550)}function wooText(){return selected[0]+'\n\n'+selected[1]+'\n\nA moment to reflect: '+selected[2]+'\n\nwoowooish.com/pick-your-woo.html'}async function share(){if(navigator.share){try{await navigator.share({title:'My Woo for today',text:wooText(),url:location.href});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(wooText());alert('Your Woo was copied to share!')}catch(e){alert(wooText())}}function save(){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const c=canvas.getContext('2d');c.fillStyle='#f8f5ef';c.fillRect(0,0,1080,1350);c.strokeStyle='#b8c8b9';c.lineWidth=3;c.strokeRect(75,75,930,1200);c.textAlign='center';c.fillStyle='#6b8072';c.font='30px sans-serif';c.fillText('W O O W O O I S H',540,190);c.fillStyle='#393c37';function wrap(t,y,font,maxWidth,lineHeight){c.font=font;let words=t.split(' '),line='';for(const w of words){let test=line?line+' '+w:w;if(c.measureText(test).width>maxWidth&&line){c.fillText(line,540,y);y+=lineHeight;line=w}else line=test}c.fillText(line,540,y);return y+lineHeight}let y=wrap(selected[0],420,'bold 58px Georgia',830,78);y=wrap(selected[1],y+70,'39px Georgia',820,62);c.fillStyle='#6b8072';wrap(selected[2],Math.max(y+95,920),'italic 30px Georgia',820,52);c.font='28px sans-serif';c.fillText('calm · peace · love',540,1190);const a=document.createElement('a');a.download='my-woo.png';a.href=canvas.toDataURL('image/png');a.click()}start();
</script></body></html>
